[build]
  publish = "."

# O painel é uma aplicação estática: não precisa de build command.
# Ao conectar este repositório ao Netlify, cada push na branch principal
# gera uma nova publicação automaticamente.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
